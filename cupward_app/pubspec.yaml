name: cupward
description: "The Cupward app is the Flutter client for Cupward, an AI-powered coffee companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.50.0"

dependencies:
  firebase_app_check: ^0.5.2
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  # Developed in this repository and depended on by path until it is published.
  firebase_hybrid_ai:
    path: ../firebase_hybrid_ai
  flutter:
    sdk: flutter
  # Developed in this repository and depended on by path until it is published.
  flutter_bookoo:
    path: ../flutter_bookoo
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
    - assets/brew_steps/

  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm_serif_display/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/dm_serif_display/DMSerifDisplay-Italic.ttf
          style: italic
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500