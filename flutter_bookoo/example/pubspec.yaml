name: flutter_bookoo_example
description: "Minimal app for testing and demonstrating flutter_bookoo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bookoo:
    path: ..
  flutter_splendid_ble: ^1.8.1
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the example renders the same on every platform without fetching fonts at runtime. Both are licensed
  # under the SIL Open Font License; the license text sits next to each font.
  fonts:
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm_serif_display/DMSerifDisplay-Regular.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/ibm_plex_mono/IBMPlexMono-Medium.ttf
          weight: 500
