name: firebase_hybrid_ai
description: "A community-developed bridge between Flutter and the Firebase AI Logic hybrid inference SDKs, which run prompts on-device when a local model is available and fall back to the cloud when it is not."
version: 0.0.2
repository: https://github.com/Toglefritz/cupward/tree/main/firebase_hybrid_ai
topics:
  - firebase
  - gemini
  - on-device-ai
  - llm
  - generative-ai

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  firebase_core: ^5.1.0
  firebase_core_web: ^4.1.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.19.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.1
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.splendidendeavors.firebase_hybrid_ai
        pluginClass: FirebaseHybridAiPlugin
      ios:
        pluginClass: FirebaseHybridAiPlugin
      web:
        pluginClass: FirebaseHybridAiWeb
        fileName: firebase_hybrid_ai_web.dart
