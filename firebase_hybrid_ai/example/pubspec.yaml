name: firebase_hybrid_ai_example
description: "Demonstrates how to use the firebase_hybrid_ai plugin."
publish_to: 'none'

environment:
  sdk: ^3.14.0

dependencies:
  firebase_core: ^5.1.0
  # The example is bundled with the plugin, so it depends on the plugin by path.
  firebase_hybrid_ai:
    path: ../
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
